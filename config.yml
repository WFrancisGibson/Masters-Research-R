default:
  seed: 2026
  paths:
    raw: data/raw
    interim: data/interim
    processed: data/processed
    models: models
    tables: output/tables
    figures: output/figures
    logs: output/logs
  data:
    annual_dir: claim-simulation-annual  # data/raw/<annual_dir>: claims, transactions, triangle
    n_dev: 20            # 20 accident years x 20 development years; payments after
                         # development year 20 are reported apart (triangle.csv folds
                         # them into year 20, a leak into observed cell (1, 20))
    scale: 1000000       # fit in millions (Paper C fits in 1'000 CHF)
  odp:
    phi: deviance        # headline dispersion of the bCCNN script (Pearson residuals, phi of
                         # the bCCNN and its bootstrap): deviance (Paper C eq. (5)) or
                         # pearson (glmReserve); both scripts report both estimates
    nsim: 1000           # bootstrap samples: glmReserve, England & Verrall (1999) Section 4
                         # and Paper C Section 2.3 (1'000)
  bccnn:                 # Paper C: Gabrielli, Richman & Wuthrich (2020)
    model:               # eq. (13)-(14), Listing 4
      hidden: [20, 15, 10]            # neurons of the 3 hidden layers
      activation: tanh
      dropout: 0.1                    # after every hidden layer
      trainable_embeddings: false     # ccODP alpha_i, beta_j stay fixed
    training:            # Section 3.3; loss Poisson deviance, optimiser RMSprop
      learning_rate: 0.001
      rho: 0.9
      epsilon: 1.0e-07   # keep the ".0": YAML reads 1e-7 as text
      batch_size: ~      # ~ (null) = full batch: one gradient-descent step per epoch
      max_epochs: 1000   # length of each early-stopping run (Paper C Figure 2)
      epochs: ~          # ~ = step with the lowest validation loss; a number overrides
                         # (at most max_epochs: the tables need its validation losses)
      validation: rolling_origin  # early stopping: rolling_origin (Al-Mudafer et al. 2021)
                                  # or claims_split (Paper C's 50/50 claims split)
      final_fit: refit   # refit: train on the full triangle for the chosen steps
                         # (Paper C); partition: keep the network trained on the final
                         # partition's training cells (Al-Mudafer et al.; rolling origin only)
    rolling_origin:      # Al-Mudafer et al. (2021) Section 3.1, scaled from their 40 x 40
      test_periods: [5, 2]  # test partitions hold out the latest 5 and 2 calendar years
                            # (theirs: 10 and 4 of 40 quarters)
      vali_periods: 2       # validation: latest 2 calendar years of each partition (theirs: 4)
      exclude: 2            # ... except the first 2 accident and development years (theirs: 3)
    bootstrap:           # Paper C Section 3.3.4, eqs. (15)-(16): parametric bootstrap
      nsim: 1000         # bCCNN refits (Paper C: 1'000; ~13 s each on CPU, ~3.5 h), saved in
                         # data/processed and resumed after a stop; 0 = skip
  nncl:                  # Wuthrich (2018) EAJ 8:407-436: neural network chain ladder
    data_dir: claim-simulation-machine  # data/raw/<data_dir>: claims.csv, summary.csv
    simulation:          # Listing 1: Gabrielli & Wuthrich (2018) machine V1
      expected_claims: 5000000        # V
      lob_dist: [0.35, 0.20, 0.15, 0.30]
      growth: [0, 0, 0, 0]
      seed1: 100
      std1: 0.85
      std2: 0.85
      rng_rounding: true # sample.kind "Rounding" of R < 3.6 in the master and the
                         # workers, to come close to the paper's data
    first_ay: 1994
    n_ay: 12             # I = 12 accident years, development years j = 0..J = 11
    model:               # Section 3, Listing 2
      q: [5, 10, 20]     # hidden neurons (Table 5)
      q_main: 20         # the reserves, Figs 8-9 and the sensitivity runs
      activation: tanh
    training:            # Listing 2: loss mse, optimiser rmsprop
      epochs: 100
      batch_size: 10000
      validation_split: 0.1  # Keras: the last 10% of the rows, ordered by AY and
                             # features
    sensitivity:         # runs S1-S4 at q_main, each adds one change
      learning_rate: 0.001   # S1: Adam
      max_epochs: 500        # S2: early stopping on the validation loss
      patience: 20
    runs: [paper_q5, paper_q10, paper_q20, s1_adam, s2_early_stop, s3_cl_start]
                         # networks to fit; s4_balance = s3_cl_start + balance
    units: 1000          # EAJ tables in 1'000
    risks_units: 10000   # Risks tables in 10'000
    synthetic:           # SynthETIC portfolio only (own design, not in the paper): every
                         # combination of hidden layers, optimiser and training
      hidden: [[20], [20, 20, 15], [20, 15, 10]]  # neurons of the hidden layers; [20] is
                         # the paper's q = 20, [20, 15, 10] the layers of the bCCNN
      optimizers:        # Keras optimiser: learning rate (Keras default unless noted)
        sgd: 0.001           # Keras default 0.01: the networks of three hidden layers
        sgd_momentum: 0.001  # (sgd) and all networks (momentum) diverge in trial fits
        sgd_nesterov: 0.001
        adagrad: 0.01        # Keras default 0.001 hardly moves in 100 full-batch steps
        adadelta: 1.0        # Zeiler (2012); Keras default 0.001 hardly moves
        rmsprop: 0.001       # Listing 2
        adam: 0.001          # S1
        adamw: 0.001
        adamax: 0.001
        nadam: 0.001
      momentum: 0.9      # sgd_momentum and sgd_nesterov
      training: [paper, cl_start]  # paper: Listing 2 (100 epochs, random start);
                         # cl_start: early stopping from the homogeneous CL factor (as S3)
      seeds: 20          # fits per run that differ in the seed only: seed, seed + 1, ...
      nagging: 10        # networks of a nagging predictor (Richman & Wuthrich 2020):
                         # the CL factors averaged over 10 seeds, one predictor per
                         # block of 10 seeds
      age: dummy         # Age of Claimant in the networks: four dummies. Leave it:
                         # the profile age_numeric below switches to numeric (one
                         # input, an ordinal score: the midpoint of the band by the
                         # MinMaxScaler (3.8)) together with tag and out_dir
      age_midpoints:     # numeric: midpoint of the band in years
        "0-15": 7.5
        "15-30": 22.5
        "30-50": 40
        "50-65": 57.5
        "over 65": 75    # 65 to 85
      tag: nncl_synthetic    # the fits of a coding: data/processed/<tag>_fit_<run>.rds,
                             # models/<tag>/
      out_dir: synthetic     # and its outputs: output/tables|figures/04_NN-chain-ladder/
                             # <out_dir>

age_numeric:             # R_CONFIG_ACTIVE=age_numeric: the NN chain ladder SynthETIC
                         # scripts with Age of Claimant as an ordinal score; its fits
                         # and outputs apart from those of the dummy coding
  nncl:
    synthetic:
      age: numeric
      tag: nncl_synthetic_age_numeric
      out_dir: synthetic-age-numeric

quick:                   # R_CONFIG_ACTIVE=quick: a fast check run of the ODP GLM and bCCNN
                         # scripts, its outputs and bootstrap cache apart
  paths:
    processed: data/processed/quick
    models: models/quick
    tables: output/quick/tables
    figures: output/quick/figures
    logs: output/quick/logs
  odp:
    nsim: 50
  bccnn:
    training:
      max_epochs: 100
    bootstrap:
      nsim: 4

